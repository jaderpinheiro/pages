<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Intranet Comercial · MultiCloud</title>
<link rel="icon" href="../Logo-img.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--bg:#03080d;--panel:#07121c;--panel2:#0b1a28;--blue:#01aeff;--blue-dark:#002d4b;--blue-mid:#005b8e;--white:#fff;--text:#d7e6f2;--muted:#7f98ad;--line:rgba(1,174,255,.16);--glow:rgba(1,174,255,.15);--ok:#2fd68a;--warn:#ffb020;--alert:#ff5a6a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;font-size:15px;line-height:1.55;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(1,174,255,.08),transparent 60%),rgba(3,8,13,.92);z-index:-1}
a{color:var(--blue)}
.mono{font-family:'Space Mono',monospace}
/* topbar */
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:auto;display:flex;align-items:center;gap:20px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.brand img{height:24px}
.brand span{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--blue);border-left:1px solid var(--line);padding-left:12px;text-transform:uppercase}
.search{flex:1;position:relative;max-width:620px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--white);font:inherit;padding:11px 44px 11px 40px;border-radius:8px;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--glow)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;fill:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.contact-q{display:flex;gap:8px;margin-left:auto}
.contact-q button{background:transparent;border:1px solid var(--line);color:var(--text);font-family:'Space Mono',monospace;font-size:11px;padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.contact-q button:hover{border-color:var(--blue);color:var(--blue)}
.chips{max-width:1400px;margin:auto;padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;letter-spacing:.04em;padding:4px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);color:#001522;border-color:var(--blue)}
/* layout */
.wrap{max-width:1400px;margin:auto;display:grid;grid-template-columns:230px 1fr;gap:28px;padding:24px 16px 80px}
.side{position:sticky;top:130px;align-self:start;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:16px;padding:8px 12px;border-left:2px solid transparent}
.side a b{font-family:'Space Mono',monospace;font-size:10px;color:var(--blue-mid);font-weight:400}
.side a:hover,.side a.act{color:var(--white);border-left-color:var(--blue);background:linear-gradient(90deg,var(--glow),transparent)}
.side .n{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}
section{margin-bottom:48px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.sh .idx{font-family:'Space Mono',monospace;color:var(--blue);font-size:12px}
h2{font-family:'Rajdhani',sans-serif;font-size:30px;font-weight:700;color:var(--white);line-height:1.1}
.sd{color:var(--muted);margin-bottom:18px;max-width:780px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:18px;position:relative;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:rgba(1,174,255,.4)}
.card.wide{grid-column:1/-1}
.card h3{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--white);line-height:1.15;padding-right:70px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:rgba(47,214,138,.4)}
.tag.warn{color:var(--warn);border-color:rgba(255,176,32,.45)}
.tag.date{color:var(--blue);border-color:rgba(1,174,255,.35)}
.lbl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.quote{border-left:3px solid var(--blue);background:rgba(1,174,255,.06);padding:10px 12px;color:var(--white);font-weight:600;border-radius:0 6px 6px 0}
.use{color:var(--text);font-style:italic}
.legal{border:1px solid rgba(255,176,32,.45);background:rgba(255,176,32,.07);color:#ffd88a;padding:8px 10px;border-radius:6px;font-size:13px}
.sols{display:flex;flex-wrap:wrap;gap:6px}
.sols span{font-size:12px;background:var(--blue-dark);color:#9fdcff;padding:3px 9px;border-radius:99px}
.cp{position:absolute;top:14px;right:14px;background:transparent;border:1px solid var(--line);color:var(--blue);font-family:'Space Mono',monospace;font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer;display:flex;gap:5px;align-items:center}
.cp:hover{background:var(--blue);color:#001522}
.cp.done{background:var(--ok);border-color:var(--ok);color:#001522}
.cp-row{display:flex;gap:6px;flex-wrap:wrap}
.cp-row .cp{position:static}
p+p{margin-top:8px}
/* hero */
.hero{border:1px solid var(--line);border-radius:12px;padding:28px;background:radial-gradient(ellipse at top right,rgba(1,174,255,.18),transparent 60%),var(--panel);position:relative;margin-bottom:22px}
.hero .lbl{margin-bottom:10px}
.hero blockquote{font-family:'Rajdhani',sans-serif;font-size:clamp(22px,3vw,32px);font-weight:700;color:var(--white);line-height:1.15;max-width:950px}
.hero blockquote em{color:var(--blue);font-style:normal}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{border-top:1px solid var(--line);padding-top:10px}
.stat b{display:block;font-family:'Rajdhani',sans-serif;font-size:30px;color:var(--blue);line-height:1}
.stat span{font-size:12px;color:var(--muted)}
/* steps */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:'Space Mono',monospace;color:var(--blue);font-size:18px}
.step h4{font-family:'Rajdhani',sans-serif;font-size:18px;color:var(--white)}
.step .cp{position:static}
/* checklist */
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check input{accent-color:var(--blue);margin-top:4px;width:16px;height:16px;flex-shrink:0}
.check label:has(input:checked) span{color:var(--muted);text-decoration:line-through}
.btn{background:var(--blue);color:#001522;border:0;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;padding:8px 16px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.score{font-family:'Space Mono',monospace;font-size:13px;color:var(--muted)}
.score b{color:var(--white)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);text-align:left;padding:8px;border-bottom:1px solid var(--blue-mid)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--white);font-weight:600;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
mark{background:rgba(1,174,255,.35);color:var(--white);border-radius:2px}
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.hide{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,40px);opacity:0;background:var(--blue);color:#001522;font-family:'Rajdhani',sans-serif;font-weight:700;padding:10px 20px;border-radius:8px;transition:.25s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{border-top:1px solid var(--line);padding:20px 16px;text-align:center;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
.pb-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.pb-form label{display:flex;flex-direction:column;gap:4px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.pb-form input,.pb-form select,.hand textarea{background:var(--bg);border:1px solid var(--line);color:var(--white);font:14px 'Exo 2',sans-serif;padding:8px 10px;border-radius:6px;outline:none;text-transform:none;letter-spacing:0}
.pb-form input:focus,.hand textarea:focus{border-color:var(--blue)}
.pb-form .w2{grid-column:span 2}
.pb-tabs{display:flex;flex-wrap:wrap;gap:8px}
.script{background:rgba(1,174,255,.05);border-left:3px solid var(--blue);padding:10px 12px;margin:8px 0;color:var(--white);border-radius:0 6px 6px 0}
.obj{font-size:13px;color:var(--muted)}
.dica{font-size:13px;color:#ffd88a}
.v{color:var(--blue);font-weight:600}
.ph{color:var(--warn);font-family:'Space Mono',monospace;font-size:12px}
.pb-h{font-family:'Rajdhani',sans-serif;font-size:22px;color:var(--white);margin:26px 0 12px}
.pbm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.pbm-h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pbm-h .cp{position:static}
.pbm h4{font-family:'Rajdhani',sans-serif;font-size:18px;color:var(--white)}
.hand{margin-top:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hand textarea{min-height:90px;resize:vertical;width:100%}
@media(max-width:900px){
  .pb-form{grid-template-columns:1fr 1fr}
  .pb-form .w2{grid-column:1/-1}
  .wrap{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .side a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:6px 10px}
  .side .n{display:none}
  .contact-q{display:none}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand span{display:none}
  .step{grid-template-columns:30px 1fr}
  .step .cp{grid-column:2}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="../index.html"><img src="../MultiCloud.png" alt="MultiCloud"><span>Intranet Comercial</span></a>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
      <input id="q" type="search" placeholder="Buscar: ransomware, backup, Claro, agro, objeção preço…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="contact-q">
      <button data-copy="(62) 3142-0818">WhatsApp</button>
      <button data-copy="0800 000 5542">0800</button>

  <div class="chips" id="chips"></div>
</header>

<div class="wrap">

  <main id="main">

</div>

<script>

/* Filtro de setor */

$('#chips').innerHTML=setores.map(s=>`<button class="chip${s=='Todos'?' on':''}" data-f="${s}">${s}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;setor=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==b));apply();if(setor!='Todos')location.hash='incidentes';};

/* Busca (ignora acentos) */
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cards=[...document.querySelectorAll('.card')];
cards.forEach(c=>{c._base=c.innerHTML;c._txt=norm(c.textContent+' '+(c.dataset.k||'')+' '+(c.dataset.f||''));});
function highlight(el,terms){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest('button,.lbl')?2:1});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue,nt=norm(t);let out='',last=0,found=false;
    const re=new RegExp(terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');let m;
    while((m=re.exec(nt))){if(!m[0])break;found=true;out+=esc(t.slice(last,m.index))+'<mark>'+esc(t.slice(m.index,m.index+m[0].length))+'</mark>';last=m.index+m[0].length;}
    if(found){const sp=document.createElement('span');sp.innerHTML=out+esc(t.slice(last));n.replaceWith(sp);}});
}
function apply(){
  const terms=norm($('#q').value.trim()).split(/\s+/).filter(Boolean);
  let total=0;
  cards.forEach(c=>{
    if(c.innerHTML!==c._base){const st=[...c.querySelectorAll('input')].map(i=>i.checked);c.innerHTML=c._base;c.querySelectorAll('input').forEach((i,k)=>i.checked=st[k]);}
    const okQ=terms.every(t=>c._txt.includes(t));
    const okS=setor=='Todos'||!c.classList.contains('inc')||(c.dataset.f||'').includes(setor);
    const show=okQ&&okS;c.classList.toggle('hide',!show);
    if(show&&terms.length)highlight(c,terms);
  });
  document.querySelectorAll('section').forEach(s=>{
    if(s.dataset.static){const h=terms.length>0;s.classList.toggle('hide',h);side.querySelector(`[data-s="${s.id}"]`).classList.toggle('hide',h);return;}
    const n=s.querySelectorAll('.card:not(.hide)').length;total+=n;
    s.classList.toggle('hide',n===0);
    const a=side.querySelector(`[data-s="${s.id}"]`);a.classList.toggle('hide',n===0);
    a.querySelector('.n').textContent=terms.length||setor!='Todos'?n:'';
  });
  $('#empty').style.display=total?'none':'block';
  bindChecks();
}
let tmr;$('#q').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(()=>{apply();if($('#q').value)window.scrollTo({top:0});},120)});
document.addEventListener('keydown',e=>{if(e.key=='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}if(e.key=='Escape'){$('#q').value='';apply();}});

/* Copiar */
const toast=$('#toast');let tt;
function copy(txt,btn){
  const done=()=>{toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1400);if(btn){const o=btn.innerHTML;btn.classList.add('done');btn.innerHTML='✓ Copiado';setTimeout(()=>{btn.classList.remove('done');btn.innerHTML=o},1400);}};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done));else fallback(txt,done);
}
function fallback(txt,done){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-from]');if(f){copy(document.getElementById(f.dataset.from).innerText,f);return;}
  const b=e.target.closest('[data-i],[data-copy]');if(!b)return;
  copy(b.dataset.copy??STORE[b.dataset.i],b.dataset.i?b:null);
});

/* Checklist */
function bindChecks(){
  const box=document.querySelectorAll('[data-c]');
  const upd=()=>{const y=[...box].filter(i=>i.checked).length;$('#score').innerHTML=`Respondidas “sim”: <b>${y}</b>/${CHECK.length}`;};
  box.forEach(i=>i.onchange=upd);upd();
  const g=$('#cpGaps');if(g)g.onclick=()=>{const gaps=[...box].filter(i=>!i.checked).map(i=>'• '+CHECK[i.dataset.c]);copy('Lacunas identificadas no diagnóstico:\n'+(gaps.join('\n')||'Nenhuma'),g);};
  const r=$('#rst');if(r)r.onclick=()=>{box.forEach(i=>i.checked=false);upd();};
}
bindChecks();

/* Playbook: dados do atendimento + falas dinâmicas */
const PBK='mc-pb';let V={dur:'30',serv:'diag'};
try{Object.assign(V,JSON.parse(localStorage.getItem(PBK)||'{}'))}catch(e){}
if(!SERVICOS[V.serv])V.serv='diag';
const savePB=()=>{try{localStorage.setItem(PBK,JSON.stringify(V))}catch(e){}};
const PERS=['sdr','nome','empresa','cargo','diretor','dur','horarios'];
function vars(){const s=SERVICOS[V.serv];
  const gaps=[...document.querySelectorAll('[data-c]')].filter(i=>!i.checked).map(i=>'• '+CHECK[i.dataset.c]).join('\n');
  return {...V,serv:s.n,tema:s.tema,gancho:s.gancho,caso:s.caso,valor:s.valor,perguntas:s.perguntas.map(p=>'• '+p).join('\n'),gaps,notes:V.notes||'—'};}
function fill(t,html){const v=vars();
  if(!html)return t.replace(/\{(\w+)\}/g,(m,k)=>(v[k]||'').trim()||`[${k}]`);
  return t.split(/(\{\w+\})/).map(p=>{const m=p.match(/^\{(\w+)\}$/);if(!m)return nl(p);const x=(v[m[1]]||'').trim();
    return x?(PERS.includes(m[1])?`<b class="v">${nl(x)}</b>`:nl(x)):`<span class="ph">[${m[1]}]</span>`;}).join('');}
function renderPB(){
  $('#pbTabs').innerHTML=Object.entries(SERVICOS).map(([k,s])=>`<button class="chip${k==V.serv?' on':''}" data-sv="${k}">${esc(s.n)}</button>`).join('');
  $('#pbSteps').innerHTML=PB.map((p,i)=>`<div class="step"><div><h4>${esc(p.t)}</h4><div class="obj">🎯 ${esc(p.obj)}</div><div class="script" id="pb${i}">${fill(p.txt,1)}</div><div class="dica">💡 ${fill(p.dica,1)}</div></div>${p.noCopy?'':`<button class="cp" data-from="pb${i}">⧉ Copiar</button>`}</div>`).join('');
  $('#pbPos').innerHTML=POS.map((p,i)=>`<div class="pbm"><div class="pbm-h"><h4>${esc(p.t)}</h4><button class="cp" data-from="po${i}">⧉ Copiar</button></div><div class="script" id="po${i}">${fill(p.txt,1)}</div></div>`).join('');
}
$('#pbTabs').onclick=e=>{const b=e.target.closest('[data-sv]');if(!b)return;V.serv=b.dataset.sv;savePB();renderPB();};
document.querySelectorAll('[data-v]').forEach(el=>{if(V[el.dataset.v])el.value=V[el.dataset.v];
  el.addEventListener('input',()=>{V[el.dataset.v]=el.value;savePB();if(el.dataset.v!='notes')renderPB();});});
$('#cpHand').onclick=()=>copy(fill(HAND),$('#cpHand'));
renderPB();

/* Menu ativo ao rolar */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)side.querySelectorAll('a').forEach(a=>a.classList.toggle('act',a.dataset.s==e.target.id));}),{rootMargin:'-140px 0px -60% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
</script>
